[project]
name = "foodbridge"
version = "0.1.0"
description = "FoodBridge API and independently runnable agent workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.16,<1",
  "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6",
  "redis>=5,<7",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/foodbridge"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires migrated PostgreSQL/PostGIS and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
