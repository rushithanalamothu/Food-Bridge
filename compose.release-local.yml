# Isolated local verification stack. Always use -p foodbridge-release and .env.release-local.
x-release-env: &release-env
  FOODBRIDGE_BROWSER_AUTH_ENABLED: 'true'
  FOODBRIDGE_BROWSER_REGISTRATION_ENABLED: 'true'
  FOODBRIDGE_BROWSER_COOKIE_NAME: foodbridge_release_session
  FOODBRIDGE_PUBLIC_URL: http://localhost:55173
  FOODBRIDGE_OIDC_ISSUER: http://localhost:55173/identity/realms/foodbridge
  FOODBRIDGE_OIDC_AUDIENCE: foodbridge-api
  FOODBRIDGE_OIDC_CLIENT_ID: foodbridge-web
  FOODBRIDGE_OIDC_JWKS_URL: http://keycloak:8080/identity/realms/foodbridge/protocol/openid-connect/certs
  FOODBRIDGE_OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
  FOODBRIDGE_ENABLE_LOCAL_INTAKE_DEMO: 'true'
  FOODBRIDGE_ENABLE_LOCAL_WORKFLOW_DEMO: 'true'
  FOODBRIDGE_NOTIFICATION_MODE: smtp
  FOODBRIDGE_SMTP_HOST: mailpit
  FOODBRIDGE_SMTP_PORT: '1025'
  FOODBRIDGE_SMTP_SECURITY: none
  FOODBRIDGE_SMTP_SENDER: notifications@example.test
  FOODBRIDGE_SMTP_ALLOWED_DOMAINS: '["example.test"]'
  FOODBRIDGE_AI_PROVIDER: rules
  # Rules mode is deterministic; do not inherit a developer .env provider endpoint.
  FOODBRIDGE_AI_BASE_URL: ''
services:
  db:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    environment: *release-env
    ports: !reset []
    command:
      [
        'uv',
        'run',
        '--no-sync',
        'uvicorn',
        'foodbridge.api.main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--no-access-log',
      ]
  migrate:
    environment: *release-env
  intake:
    environment: *release-env
  orchestrator:
    environment: *release-env
  matching:
    environment: *release-env
  reservation:
    environment: *release-env
  intake-relay:
    environment: *release-env
  workflow-runtime:
    environment: *release-env
  web:
    image: foodbridge-release-web:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    ports: !override ['127.0.0.1:55173:5173']
  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_WEBROOT: /test-inbox/
    ports: !reset []
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ['start-dev', '--import-realm']
    environment:
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx384m
      KC_HOSTNAME: http://localhost:55173/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: foodbridge-local-only
    volumes:
      - 'keycloak-local-data:/opt/keycloak/data'
      - './deploy/keycloak/local-realm.json:/opt/keycloak/data/import/realm.json:ro'
      - './deploy/keycloak/themes:/opt/keycloak/themes:ro'
      - './apps/web/src/styles/theme.css:/opt/keycloak/themes/foodbridge/login/resources/css/shared.css:ro'
    ports: !reset []
volumes:
  keycloak-local-data:
