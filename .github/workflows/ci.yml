name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: make check

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: foodbridge
          POSTGRES_PASSWORD: foodbridge_local
          POSTGRES_DB: foodbridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodbridge -d foodbridge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
          enable-cache: true
      - run: uv sync --locked
      - run: make migrate
      - run: uv run alembic -c backend/alembic.ini check
      - run: make integration

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @foodbridge/web -- playwright install --with-deps chromium
      - name: Intake browser and full workflow worker smoke
        env:
          FOODBRIDGE_ENABLE_LOCAL_INTAKE_DEMO: 'true'
          FOODBRIDGE_ENABLE_LOCAL_WORKFLOW_DEMO: 'true'
          FOODBRIDGE_NOTIFICATION_MODE: sandbox
        run: |
          uv run python scripts/seed_intake_demo.py
          uv run uvicorn foodbridge.api.main:app --host 127.0.0.1 --port 8000 > /tmp/intake-api.log 2>&1 &
          intake_api_pid=$!
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q intake --pool=solo --loglevel=INFO > /tmp/intake-worker.log 2>&1 &
          intake_worker_pid=$!
          uv run python -m foodbridge.agents.intake.relay > /tmp/intake-relay.log 2>&1 &
          intake_relay_pid=$!
          trap 'kill "$intake_api_pid" "$intake_worker_pid" "$intake_relay_pid" "${workflow_orchestrator_pid:-}" "${workflow_matching_pid:-}" "${workflow_reservation_pid:-}" "${workflow_runtime_pid:-}" 2>/dev/null || true' EXIT
          uv run python scripts/smoke_intake.py
          npm run test:e2e
          uv run python scripts/seed_workflow_demo.py
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q orchestrator --pool=solo --loglevel=INFO --hostname=orchestrator@%h > /tmp/workflow-orchestrator.log 2>&1 &
          workflow_orchestrator_pid=$!
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q matching --pool=solo --loglevel=INFO --hostname=matching@%h > /tmp/workflow-matching.log 2>&1 &
          workflow_matching_pid=$!
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q reservation --pool=solo --loglevel=INFO --hostname=reservation@%h > /tmp/workflow-reservation.log 2>&1 &
          workflow_reservation_pid=$!
          uv run python -m foodbridge.agents.orchestrator.runtime > /tmp/workflow-runtime.log 2>&1 &
          workflow_runtime_pid=$!
          uv run python scripts/smoke_workflow.py
          FOODBRIDGE_RUN_FULL_BROWSER=1 npm run test:e2e --workspace @foodbridge/web -- full-workflow.spec.ts
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intake-browser-failure
          path: apps/web/test-results/
          if-no-files-found: ignore

  release-integration:
    name: OIDC browser and SMTP release integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: npm exec --workspace @foodbridge/web -- playwright install --with-deps chromium
      - name: Start isolated identity and SMTP stack
        run: |
          FOODBRIDGE_BACKEND_IMAGE=foodbridge-backend:release-local docker compose -p foodbridge-release -f compose.yaml -f compose.release-local.yml up --build -d
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:55173/identity/realms/foodbridge/.well-known/openid-configuration > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:55173/identity/realms/foodbridge/.well-known/openid-configuration > /dev/null
          FOODBRIDGE_BACKEND_IMAGE=foodbridge-backend:release-local docker compose -p foodbridge-release -f compose.yaml -f compose.release-local.yml exec -T api uv run --no-sync python scripts/seed_release_demo.py
      - name: Real login, driver/operations and SMTP acceptance
        run: FOODBRIDGE_RELEASE_E2E=1 npm run test:e2e
      - name: Production frontend and runtime configuration validation
        run: |
          docker build -t foodbridge-web:release-static -f deploy/Dockerfile.web .
          docker run --rm --network foodbridge-release_default -e FOODBRIDGE_DOMAIN=http://localhost -e FOODBRIDGE_AUTH_DOMAIN=http://login.localhost foodbridge-web:release-static caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run -d --name foodbridge-ci-gateway --network foodbridge-release_default -e FOODBRIDGE_DOMAIN=http://localhost -e FOODBRIDGE_AUTH_DOMAIN=http://login.localhost -p 127.0.0.1:58500:80 foodbridge-web:release-static
          uv run python scripts/smoke_gateway.py --base-url http://localhost:58500 --allow-local-http
          uv run python scripts/init_deployment.py --domain foodbridge.example.test --auth-domain login.example.test --backend-image foodbridge-backend:release-local --web-image foodbridge-web:release-static
          docker compose --env-file deploy/runtime/runtime.env -f deploy/compose.production.yml config --quiet
      - name: Backup and isolated restore verification
        run: |
          uv run python scripts/database_backup.py --project foodbridge-release --compose compose.yaml --compose compose.release-local.yml backup --archive /tmp/foodbridge-release.dump
          uv run python scripts/database_backup.py --project foodbridge-release --compose compose.yaml --compose compose.release-local.yml verify-restore --archive /tmp/foodbridge-release.dump
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-failure
          path: apps/web/test-results
      - name: Stop local verification stack
        if: always()
        run: |
          docker rm -f foodbridge-ci-gateway 2>/dev/null || true
          FOODBRIDGE_BACKEND_IMAGE=foodbridge-backend:release-local docker compose -p foodbridge-release -f compose.yaml -f compose.release-local.yml down
