name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: make check

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: foodbridge
          POSTGRES_PASSWORD: foodbridge_local
          POSTGRES_DB: foodbridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodbridge -d foodbridge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
          enable-cache: true
      - run: uv sync --locked
      - run: make migrate
      - run: uv run alembic -c backend/alembic.ini check
      - run: make integration
