name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: make check

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: foodbridge
          POSTGRES_PASSWORD: foodbridge_local
          POSTGRES_DB: foodbridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodbridge -d foodbridge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.10'
          enable-cache: true
      - run: uv sync --locked
      - run: make migrate
      - run: uv run alembic -c backend/alembic.ini check
      - run: make integration

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @foodbridge/web -- playwright install --with-deps chromium
      - name: Intake browser and full workflow worker smoke
        env:
          FOODBRIDGE_ENABLE_LOCAL_INTAKE_DEMO: 'true'
          FOODBRIDGE_ENABLE_LOCAL_WORKFLOW_DEMO: 'true'
          FOODBRIDGE_NOTIFICATION_MODE: sandbox
        run: |
          uv run python scripts/seed_intake_demo.py
          uv run uvicorn foodbridge.api.main:app --host 127.0.0.1 --port 8000 > /tmp/intake-api.log 2>&1 &
          intake_api_pid=$!
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q intake --pool=solo --loglevel=INFO > /tmp/intake-worker.log 2>&1 &
          intake_worker_pid=$!
          uv run python -m foodbridge.agents.intake.relay > /tmp/intake-relay.log 2>&1 &
          intake_relay_pid=$!
          trap 'kill "$intake_api_pid" "$intake_worker_pid" "$intake_relay_pid" "${workflow_orchestrator_pid:-}" "${workflow_matching_pid:-}" "${workflow_reservation_pid:-}" "${workflow_runtime_pid:-}" 2>/dev/null || true' EXIT
          uv run python scripts/smoke_intake.py
          npm run test:e2e
          uv run python scripts/seed_workflow_demo.py
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q orchestrator --pool=solo --loglevel=INFO --hostname=orchestrator@%h > /tmp/workflow-orchestrator.log 2>&1 &
          workflow_orchestrator_pid=$!
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q matching --pool=solo --loglevel=INFO --hostname=matching@%h > /tmp/workflow-matching.log 2>&1 &
          workflow_matching_pid=$!
          uv run celery -A foodbridge.agents.celery_app:celery_app worker -Q reservation --pool=solo --loglevel=INFO --hostname=reservation@%h > /tmp/workflow-reservation.log 2>&1 &
          workflow_reservation_pid=$!
          uv run python -m foodbridge.agents.orchestrator.runtime > /tmp/workflow-runtime.log 2>&1 &
          workflow_runtime_pid=$!
          uv run python scripts/smoke_workflow.py
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intake-browser-failure
          path: apps/web/test-results/
          if-no-files-found: ignore
